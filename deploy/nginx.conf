server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # GoRouter routes are client-side; direct links must load the Flutter shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Flutter replaces these files at the same URL on every release. They must
  # revalidate or a browser can keep running a previous application bundle.
  location ~* ^/(?:main\.dart\.js|flutter(?:_bootstrap)?\.js|flutter_service_worker\.js|manifest\.json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:css|js|mjs|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
