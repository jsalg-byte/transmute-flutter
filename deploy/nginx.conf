server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # GoRouter routes are client-side; direct links must load the Flutter shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|wasm|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
