services:
  transmute-flutter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TRANSMUTE_REPOSITORY_MODE: ${TRANSMUTE_REPOSITORY_MODE:-api}
        TRANSMUTE_API_BASE_URL: ${TRANSMUTE_API_BASE_URL:-https://api.transmute.mzootfb.xyz}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
